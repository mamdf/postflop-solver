[package]
name = "postflop-solver"
version = "0.1.0"
authors = ["Wataru Inariba"]
edition = "2021"
description = "An open-source postflop solver for Texas hold'em poker"
documentation = "https://b-inary.github.io/postflop_solver/postflop_solver/"
repository = "https://github.com/mamdf/postflop-solver"
license = "AGPL-3.0-or-later"

[dependencies]
bincode = { version = "2.0.1", optional = true }
once_cell = "1.18.0"
rayon = { version = "1.8.0", optional = true }
regex = "1.9.6"
zstd = { version = "0.12.4", optional = true, default-features = false }

[features]
default = ["bincode", "rayon"]
custom-alloc = []
rayon = ["dep:rayon", "zstd?/zstdmt"]

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "web_case"
harness = false

[[bench]]
name = "icm_precompute"
harness = false

[[bench]]
name = "compact_save"
harness = false

# Tests exercise the CFR solver, which is unusably slow at the default `test`
# profile opt-level (0) — a spot that solves in ~1s under release can take
# minutes in debug, which is why raw `cargo test` appears to hang.
# opt-level = 3 gives release-grade speed while KEEPING debug-assertions and
# overflow checks ON (the `test` profile inherits `dev`), so tests stay reliable
# AND fast. This only affects `cargo test`; the release binary is unchanged.
[profile.test]
opt-level = 3
